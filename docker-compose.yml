services:
  db:
    image: postgres:16-alpine
    container_name: logivault-db
    environment:
      POSTGRES_DB: ${DB_NAME:-logivault}
      POSTGRES_USER: ${DB_USERNAME:-logivault}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    # Host port 5433 avoids clashing with a locally installed PostgreSQL on 5432
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - logivault-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  logivault-db:
