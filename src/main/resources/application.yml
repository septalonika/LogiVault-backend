spring:
  application:
    name: logivault
  profiles:
    default: dev
  config:
    # Reads KEY=VALUE pairs from ./.env when present (same file docker compose uses)
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:logivault}
    username: ${DB_USERNAME:logivault}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 50
        order_inserts: true
        order_updates: true
        default_batch_fetch_size: 50
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:com/logivault/db/migration
  data:
    web:
      pageable:
        max-page-size: 100

server:
  port: 8080
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logivault:
  jwt:
    secret: ${JWT_SECRET:}
    access-token-ttl: 15m
    refresh-token-ttl: 7d
  login:
    max-attempts: 5
    lock-duration: 15m
  business-zone: Asia/Jakarta
  cors:
    allowed-origins: ${LOGIVAULT_CORS_ALLOWED_ORIGINS:}
  admin:
    email: ${LOGIVAULT_ADMIN_EMAIL:}
    password: ${LOGIVAULT_ADMIN_PASSWORD:}
